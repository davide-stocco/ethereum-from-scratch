site_name: Ethereum from Scratch
site_description: How Ethereum works, built up from first principles — starting with the parts that have never changed.
site_author: Davide

site_url: https://davide-stocco.github.io/ethereum-from-scratch/

# No repo_url on purpose — it puts a GitHub link in the site header, and the
# repository is private, so the link would 404 for every visitor. The about
# page links to it in prose instead, which is easy to update at launch.

theme:
  name: material
  features:
    # Three navigation features are deliberately NOT enabled:
    #
    #   navigation.sections  pins every section open — unusable at ~15 sections
    #   navigation.prune     drops inactive subtrees from the DOM, which turns
    #                        each section header into a LINK to its first page
    #                        and leaves nothing for a transition to animate
    #   navigation.indexes   only useful once sections have landing pages
    #
    # Without them, section headers are <label> toggles that expand in place.
    - navigation.top           # "back to top" button
    - navigation.footer        # prev/next links at the bottom of each page
    - search.suggest
    - search.highlight
    - content.code.copy        # copy button on code blocks
    - content.tooltips         # styled tooltips instead of native browser ones
    - toc.follow
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/converters.js
  - javascripts/keccak.js
  - javascripts/keys.js
  - javascripts/secp256k1.js
  - javascripts/addresses.js
  - javascripts/signatures.js
  - javascripts/wallets.js
  - javascripts/boxes.js

markdown_extensions:
  - admonition                 # the coloured "note" / "warning" boxes
  - pymdownx.details           # collapsible boxes
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list                   # the glossary's "term / definition" layout
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Note: the `abbr` extension was removed deliberately. It produced
  # hover-only terms that looked clickable but weren't, sitting alongside real
  # glossary links — two mechanisms a reader couldn't tell apart. Now there is
  # exactly one: a link carrying a title, which hovers AND clicks through.
  - pymdownx.superfences:
      # lets you write ```mermaid diagrams
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# ---------------------------------------------------------------------------
# Reading order. Tiers (which decide publishing order and what a fork can
# invalidate) live in each page's frontmatter and in ROADMAP.md — never here.
#
# v3 and v4 sections stay out of this file until v1 is published: a sidebar
# listing seventy unwritten pages is worse than no sidebar.
#
# Nothing is explained before its prerequisites.
# ---------------------------------------------------------------------------
nav:
  - Home: index.md

  # ---- The five reading parts, each holding its topic sections ----------
  # Two levels on purpose. The PART labels are the question that part answers,
  # which in order read as a sentence summarising the site. The TOPIC labels
  # inside are what the material is called everywhere else — Cryptography,
  # Encoding — so a reader scanning for a subject still finds the word they
  # came looking for.
  #
  # Parts with a single topic (What it is, Why anyone bothers) list their
  # pages directly rather than carrying a one-child subsection, which would
  # be a level of nesting earning nothing.
  #
  # Directory names are untouched throughout, so no URL moves.

  - What it is:
      - What is Ethereum?: foundations/what-is-ethereum.md
      - Ether, wei and gwei: foundations/ether.md
      - Hex and bytes: foundations/hex-and-bytes.md

  - Who you are:
      - Cryptography:
          - Keccak-256: crypto/keccak256.md
          - Private keys: crypto/private-keys.md
          - Public keys: crypto/public-keys.md
          - Addresses: crypto/addresses.md
          - Signatures: crypto/signatures.md
      # Separate from Cryptography because it's the layer ABOVE the protocol —
      # conventions wallet software agreed on, which Ethereum has never heard of.
      - Wallets:
          - Wallets and seed phrases: wallets/seed-phrases.md
          - What losing your keys means: wallets/losing-your-keys.md

  - What it knows:
      - Accounts and state:
          - Accounts: accounts/accounts.md
          - The nonce: accounts/nonce.md
          - State: accounts/state.md
          # Closes the topic by arguing the trade the first three describe.
          - Why accounts, and what they cost: accounts/why-accounts.md
      # Answers the question the accounts page provokes and defers — "two
      # kinds of account, so what IS the second kind?".
      - Contracts:
          - What a smart contract is: contracts/smart-contracts.md
      # Last on purpose: the Merkle Patricia Trie explains what the state root
      # is, and state defers to it, so the reader needs state first. RLP needs
      # nothing but hex, so it travels with the trie rather than earlier.
      - Encoding:
          - RLP encoding: encoding/rlp.md
          - The Merkle Patricia Trie: encoding/merkle-patricia-trie.md

  - How it moves:
      # "Why metering is necessary" sits directly above Gas, not at the head of
      # the topic, where it would precede knowing what a transaction is.
      - Transactions:
          - Transactions: transactions/transactions.md
          - Why metering is necessary: transactions/why-metering.md
          - Gas: transactions/gas.md
          - Fees: transactions/fees.md
      - Blocks:
          - Blocks: blocks/blocks.md
          - The block header: blocks/block-header.md
          - The chain and reorgs: blocks/the-chain.md

  # Only the durable economics questions. The pages depending on Ethereum's
  # current issuance and burn wait for the protocol pages. See ROADMAP.md.
  - Why anyone bothers:
      - Why security has to be paid for: economics/security-budget.md
      - 'Who pays: issuance or fees': economics/who-pays.md
      - Fixed cap or flexible supply: economics/supply-cap.md

  # Deliberately the same phrase FORKS.md uses for this material, so the
  # policy and the menu share one vocabulary. Membership test: a page belongs
  # here if and only if a hard fork can invalidate it. Directory stays
  # reference/ so no URL moves.
  - Fork-dependent details:
      - Gas costs: reference/gas-costs.md
      - Fork history: reference/fork-history.md
  - Glossary: glossary.md
  - About:
      - Ethereum changes: about/forks.md
      - Who's writing this: about/about-me.md
