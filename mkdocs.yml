site_name: Ethereum from Scratch
site_description: How Ethereum works, built up from first principles — starting with the parts that have never changed.
site_author: Davide

site_url: https://davide-stocco.github.io/ethereum-from-scratch/

# No repo_url on purpose — it puts a GitHub link in the site header, and the
# repository is private, so the link would 404 for every visitor. The about
# page links to it in prose instead, which is easy to update at launch.

theme:
  name: material
  # Holds overrides/main.html, which adds a noindex tag while extra.unlisted
  # is true. Nothing else lives in there.
  custom_dir: overrides
  features:
    # Three navigation features are deliberately NOT enabled:
    #
    #   navigation.sections  pins every section open — unusable at ~15 sections
    #   navigation.prune     drops inactive subtrees from the DOM, which turns
    #                        each section header into a LINK to its first page
    #                        and leaves nothing for a transition to animate
    #   navigation.indexes   only useful once sections have landing pages
    #
    # Without them, section headers are <label> toggles that expand in place.
    - navigation.top           # "back to top" button
    - navigation.footer        # prev/next links at the bottom of each page
    - search.suggest
    - search.highlight
    - content.code.copy        # copy button on code blocks
    - content.tooltips         # styled tooltips instead of native browser ones
    - toc.follow
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/converters.js
  - javascripts/keccak.js
  - javascripts/keys.js
  - javascripts/secp256k1.js
  - javascripts/addresses.js
  - javascripts/signatures.js
  - javascripts/wallets.js
  - javascripts/boxes.js
  # Sends links to other sites to a new tab, so a citation doesn't cost you
  # your place in the page. Internal links are left alone on purpose.
  - javascripts/external-links.js

# ---------------------------------------------------------------------------
# unlisted: true  ->  every page carries <meta name="robots" content="noindex">
#
# The site is readable by anyone with the link, and deliberately kept out of
# search results while it is being reviewed. Set this to false to be findable;
# see the publishing checklist in README.md. Nothing else has to change.
# ---------------------------------------------------------------------------
extra:
  unlisted: true

markdown_extensions:
  - admonition                 # the coloured "note" / "warning" boxes
  - pymdownx.details           # collapsible boxes
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list                   # the glossary's "term / definition" layout
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Note: the `abbr` extension was removed deliberately. It produced
  # hover-only terms that looked clickable but weren't, sitting alongside real
  # glossary links — two mechanisms a reader couldn't tell apart. Now there is
  # exactly one: a link carrying a title, which hovers AND clicks through.
  - pymdownx.superfences:
      # lets you write ```mermaid diagrams
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# ---------------------------------------------------------------------------
# Reading order. Tiers (which decide publishing order and what a fork can
# invalidate) live in each page's frontmatter and in ROADMAP.md — never here.
#
# v3 and v4 sections stay out of this file until v1 is published: a sidebar
# listing seventy unwritten pages is worse than no sidebar.
#
# Nothing is explained before its prerequisites.
# ---------------------------------------------------------------------------
nav:
  - Home: index.md

  # ---- Six parts, each named for the question it answers ----------------
  # In order they read as a sentence: what it is, who can act, what it holds,
  # how it changes, when it's settled, why anyone bothers. The PART label is
  # the question; the TOPIC labels inside are what the material is called
  # everywhere else, so a reader scanning for "Cryptography" still finds it.
  #
  # A part with only one topic lists its pages directly — a subsection with
  # one child is nesting that earns nothing. Directory names are untouched
  # throughout, so no URL moves.

  # Keccak-256 lives here, not with the keys. It is a primitive that
  # addresses, the state root, transaction hashes and function selectors all
  # depend on — nothing to do with identity. It sat under Cryptography only
  # because it happens to precede private keys in reading order.
  - What it is:
      - What is Ethereum?: foundations/what-is-ethereum.md
      - Ether, wei and gwei: foundations/ether.md
      - Hex and bytes: foundations/hex-and-bytes.md
      - Keccak-256: crypto/keccak256.md

  - Who can act:
      - Cryptography:
          - Private keys: crypto/private-keys.md
          - Public keys: crypto/public-keys.md
          - Addresses: crypto/addresses.md
          - Signatures: crypto/signatures.md
      # Separate from Cryptography: this is the layer ABOVE the protocol —
      # conventions wallet software agreed on, which Ethereum never heard of.
      - Wallets:
          - Wallets and seed phrases: wallets/seed-phrases.md
          - What losing your keys means: wallets/losing-your-keys.md

  # Where it runs — placed here because "node" is load-bearing from the
  # signatures page onward and was defined nowhere. The definition has to
  # precede the pages that lean on it; the parts of the argument that need
  # state growth forward-reference it, the same way the state page borrows
  # four facts about blocks and says so.
  - Where it runs:
      - What a node is: nodes/what-a-node-is.md
      - Clients and the two layers: nodes/clients-and-layers.md
      - Running one yourself: nodes/running-one.md

  # "What it holds" rather than "Where": Ethereum has no location, every node
  # holds the same state, and a part called Where primes exactly the mental
  # model the state page has to demolish.
  - What it holds:
      - Accounts and state:
          - Accounts: accounts/accounts.md
          - The nonce: accounts/nonce.md
          - State: accounts/state.md
          - Why accounts, and what they cost: accounts/why-accounts.md
          # Belongs in this topic rather than a "Privacy" one of its own: a
          # subsection with a single page is a level earning nothing, and the
          # page's spine is that the state is public. It needs transactions to
          # be complete and forward-references them.
          - What it reveals: accounts/what-it-reveals.md
      # Here, not under "How it changes": this page is what a contract IS —
      # an account with code. Execution, opcodes and their costs come later
      # and belong there. It also answers the question the accounts page
      # provokes and defers, so it should arrive soon after.
      - Contracts:
          - What a smart contract is: contracts/smart-contracts.md
          # Order within the topic: what a contract is, then what is literally
          # stored at it, then the one thing it can write and not read, then
          # the thing most people mean by "contract" in the first place.
          # Tokens last because they lean on logs for transfer records.
          - What the code actually is: contracts/what-the-code-is.md
          - Events and logs: contracts/events-and-logs.md
          - Tokens aren't special: contracts/tokens.md
      # Named for what it answers, not for the technique, so it reads like a
      # question the way the other topics do. "Encoding" was a method sitting
      # among subjects, which is why it looked as though it had wandered in.
      #
      # Stays in this part rather than heading "How it changes": the trie IS
      # what the state root commits to and the state page defers to it by
      # name, and a part about change should open with a transaction, not a
      # serialisation format. RLP has a genuine pull the other way — the
      # transactions page plans to decode real bytes — but it must precede
      # the trie, which is RLP-encoded, so the two cannot be split. Here they
      # sit before both of RLP's uses, which is the property that matters.
      - How it's written:
          - RLP encoding: encoding/rlp.md
          - The Merkle Patricia Trie: encoding/merkle-patricia-trie.md

  # Gas costs folded in here, where someone hunting for a number would look.
  # It used to be its own "Fork-dependent details" section, which the
  # per-page durability labels made redundant — every page now states its own
  # staleness in its first line, so a whole section signalling the same thing
  # was a second organising principle competing with the questions.
  - How it changes:
      - Transactions: transactions/transactions.md
      - Why metering is necessary: transactions/why-metering.md
      - Gas: transactions/gas.md
      - Fees: transactions/fees.md
      - Gas costs: reference/gas-costs.md

  - When it's settled:
      - Blocks: blocks/blocks.md
      - The block header: blocks/block-header.md
      # The durable problem page sits above the mechanism that solves it, the
      # same split as "Why metering is necessary" above "Gas". Both precede
      # the-chain, because reorgs and finality cannot be explained before you
      # know who proposes and who votes.
      - Why somebody has to be chosen: blocks/why-somebody-chosen.md
      - Proof of stake: blocks/proof-of-stake.md
      - The chain and reorgs: blocks/the-chain.md

  # Only the durable economics questions. The pages depending on Ethereum's
  # current issuance and burn wait for the protocol pages. See ROADMAP.md.
  - Why anyone bothers:
      - Why security has to be paid for: economics/security-budget.md
      - 'Who pays: issuance or fees': economics/who-pays.md
      - Fixed cap or flexible supply: economics/supply-cap.md
      # The institutional question this part was always meant to hold.
      - 'Who decides, when nobody is in charge': economics/governance.md

  - Glossary: glossary.md
  - About:
      - Ethereum changes: about/forks.md
      - Fork history: reference/fork-history.md
      - Who's writing this: about/about-me.md
