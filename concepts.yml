# The site's concept dependency graph. Generated by
# tools/concepts.py and then pruned by hand: a link between two
# pages is not always a dependency, so edges are proposed from
# links and kept by judgement. Checked by tools/conceptcheck.py.
#
# 'needs' means: this page cannot be understood before that one.
# Forward references are not stored — they are derivable.

pages:
  accounts/accounts.md:
    needs:
    - crypto/addresses.md
    - crypto/keccak256.md
    - crypto/private-keys.md
    - crypto/signatures.md
    - foundations/ether.md
    - foundations/what-is-ethereum.md
    - wallets/losing-your-keys.md
    - wallets/seed-phrases.md
    part: What it holds
    summary: An account is an entry in Ethereum's state with four fields. There are two kinds, and only
      one of them can start anything.
    title: Accounts
  accounts/nonce.md:
    needs:
    - accounts/accounts.md
    - crypto/addresses.md
    - crypto/signatures.md
    - foundations/what-is-ethereum.md
    part: What it holds
    summary: A per-account counter that stops a signed transaction being used twice — and the reason transactions
      get stuck.
    title: The nonce
  accounts/state.md:
    needs:
    - accounts/accounts.md
    - crypto/addresses.md
    - crypto/keccak256.md
    - foundations/what-is-ethereum.md
    part: What it holds
    summary: The state is every account and what it holds — kept by each node, never carried in a block,
      and committed to by one 32-byte number.
    title: State
  accounts/what-it-reveals.md:
    needs:
    - accounts/state.md
    - accounts/why-accounts.md
    - crypto/addresses.md
    - crypto/private-keys.md
    - nodes/what-a-node-is.md
    part: What it holds
    summary: Everything on Ethereum is public by default — which is what makes independent checking possible,
      and what it costs the people being checked.
    title: What it reveals
  accounts/why-accounts.md:
    needs:
    - accounts/accounts.md
    - accounts/nonce.md
    - accounts/state.md
    - crypto/public-keys.md
    - foundations/ether.md
    - foundations/what-is-ethereum.md
    - nodes/running-one.md
    part: What it holds
    summary: Accounts persist where coins are consumed — which is what makes programs possible, and what
      every awkward thing about Ethereum is the price of.
    title: Why accounts, and what they cost
  contracts/events-and-logs.md:
    needs:
    - accounts/state.md
    - accounts/why-accounts.md
    - contracts/smart-contracts.md
    - contracts/what-the-code-is.md
    - nodes/what-a-node-is.md
    part: What it holds
    summary: A log is the one thing a contract can write and never read — a record for the outside world,
      deliberately kept out of the state.
    title: Events and logs
  contracts/smart-contracts.md:
    needs:
    - accounts/accounts.md
    - accounts/nonce.md
    - accounts/what-it-reveals.md
    - crypto/keccak256.md
    - foundations/what-is-ethereum.md
    - nodes/what-a-node-is.md
    - wallets/seed-phrases.md
    part: What it holds
    summary: A smart contract is a program stored at an account — and the interesting thing about it is
      everything it has been forbidden to do.
    title: What a smart contract is
  contracts/tokens.md:
    needs:
    - accounts/accounts.md
    - contracts/events-and-logs.md
    - contracts/smart-contracts.md
    - crypto/addresses.md
    - crypto/signatures.md
    - foundations/ether.md
    - foundations/what-is-ethereum.md
    - wallets/seed-phrases.md
    part: What it holds
    summary: A token is not a protocol feature. It is a contract keeping a list of numbers, and owning
      one means a number in somebody else's storage.
    title: Tokens aren't special
  contracts/what-the-code-is.md:
    needs:
    - accounts/accounts.md
    - accounts/state.md
    - contracts/smart-contracts.md
    - wallets/seed-phrases.md
    part: What it holds
    summary: The chain holds machine code, not the source you read on an explorer — and "verified" is
      somebody's claim that the two match.
    title: What the code actually is
  crypto/addresses.md:
    needs:
    - crypto/keccak256.md
    - crypto/private-keys.md
    - crypto/public-keys.md
    part: Who can act
    summary: An address is the last 20 bytes of the Keccak-256 hash of a public key — plus a checksum
      hidden in its capitalisation.
    title: Addresses
  crypto/keccak256.md:
    needs:
    - foundations/hex-and-bytes.md
    - foundations/what-is-ethereum.md
    part: What it is
    summary: Keccak-256 is Ethereum's hash function — any input in, 32 bytes out. What that buys, why
      it can't be reversed, and why it is not quite SHA-3.
    title: Keccak-256
  crypto/private-keys.md:
    needs:
    - foundations/hex-and-bytes.md
    part: Who can act
    summary: A private key is just a very large random number. Why that's enough, how large "large" is,
      and what owning ether actually consists of.
    title: Private keys
  crypto/public-keys.md:
    needs:
    - crypto/keccak256.md
    - crypto/private-keys.md
    part: Who can act
    summary: A public key is a point on a curve, computed from a private key by a step that is easy forwards
      and infeasible backwards.
    title: Public keys
  crypto/signatures.md:
    needs:
    - crypto/addresses.md
    - crypto/keccak256.md
    - crypto/private-keys.md
    - crypto/public-keys.md
    part: Who can act
    summary: How a signature proves you hold a private key, and how the sender's address is recovered
      from the signature rather than stated anywhere.
    title: Signatures
  encoding/merkle-patricia-trie.md:
    needs:
    - accounts/accounts.md
    - accounts/state.md
    - encoding/rlp.md
    - nodes/what-a-node-is.md
    part: What it holds
    summary: How one 32-byte number commits to Ethereum's entire state, and how a few kilobytes can prove
      a single balance against it.
    title: The Merkle Patricia Trie
  encoding/rlp.md:
    needs:
    - accounts/accounts.md
    - accounts/state.md
    - contracts/smart-contracts.md
    - crypto/keccak256.md
    - nodes/clients-and-layers.md
    part: What it holds
    summary: RLP turns nested lists of bytes into one flat string of bytes, and its whole purpose is that
      each value has exactly one valid encoding.
    title: RLP encoding
  foundations/ether.md:
    needs:
    - foundations/what-is-ethereum.md
    part: What it is
    summary: Ether, wei and gwei — what the units are, why Ethereum counts in whole numbers of wei, and
      why decimals would break consensus.
    title: Ether, wei and gwei
  foundations/hex-and-bytes.md:
    needs: []
    part: What it is
    summary: Bytes, hexadecimal and the 0x prefix — how to read the long strings of characters that Ethereum
      is written in.
    title: Hex and bytes
  foundations/what-is-ethereum.md:
    needs: []
    part: What it is
    summary: Ethereum explained as a state machine — a shared state plus deterministic rules for changing
      it, and why that makes trust unnecessary.
    title: What is Ethereum?
  index.md:
    needs: []
    part: Home
    summary: ''
    title: Home
  nodes/clients-and-layers.md:
    needs:
    - foundations/what-is-ethereum.md
    - nodes/what-a-node-is.md
    part: Where it runs
    summary: A node runs two cooperating programs, and several independent implementations of each exist
      on purpose — because one implementation means one bug can take the network with it.
    title: Clients and the two layers
  nodes/running-one.md:
    needs:
    - nodes/what-a-node-is.md
    part: Where it runs
    summary: What running a node actually costs, in shape rather than specification — and why that cost
      is an argument about Ethereum rather than a note about your hardware.
    title: Running one yourself
  nodes/what-a-node-is.md:
    needs:
    - crypto/signatures.md
    - foundations/what-is-ethereum.md
    - wallets/seed-phrases.md
    part: Where it runs
    summary: A node is a computer that holds the state and checks every block against the rules itself
      — which is what makes trusting anyone unnecessary.
    title: What a node is
  wallets/losing-your-keys.md:
    needs:
    - crypto/addresses.md
    - crypto/signatures.md
    - wallets/seed-phrases.md
    part: Who can act
    summary: Why there is no password reset, no customer service, and no way back — and what that actually
      implies.
    title: What losing your keys means
  wallets/seed-phrases.md:
    needs:
    - crypto/addresses.md
    - crypto/keccak256.md
    - crypto/private-keys.md
    - crypto/signatures.md
    part: Who can act
    summary: What a wallet actually holds, and how twelve ordinary words can stand behind an unlimited
      number of private keys.
    title: Wallets and seed phrases
